                    <h2>Sort By</h2>
                    <div class="sortBy__buttonGroup">
                        <label for="sortBy-priority">
                            <input type="radio" id="sortBy-priority" name="sort__choice" checked>
                            <span class="sortBy__buttonName">Priority</span>
                        </label>
                        <label for="sortBy-dueDate">
                            <input type="radio" id="sortBy-dueDate" name="sort__choice">
                            <span class="sortBy__buttonName">Due date</span>
                        </label>
                    </div>
                </div>

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">

                    </svg>
                    Delete completed tasks
                </button>
            </div>
            <h2 id="sideMenu__soonMessage">More in future versions</h2>
        </section>

        <!-- Main section -->
        <section class="mainSection">
            <!-- Task Creator section -->
            <form action="" id="taskCreator__frame" class="taskCreator hide">
                <div class="taskCreator__inputGroup">
                    <input type="text" id="newTask__name" placeholder="Describe the new task. Ex: Optimize page loading">
                    <select name="priorityLevel__selector" id="newTask__priority">
                        <option value="">Select priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <input type="date" id="date__picker" max="2999-12-31">
                </div>
                <div class="taskCreator__buttonGroup">
                    <input type="submit" id="addNewTask-button" value="Add the new task">
                    <button id="cancel-button">Cancel</button>
                </div>
                <div id="taskError_name" class="hide">
                    <p style="color: var(--red);">Enter the task name</p>
                </div>
                <div id="taskError_priority" class="hide">
                    <p style="color: var(--red);">Select the priority level</p>
                </div>
            </form>

            <!-- Active tasks Section -->
            <section id="activeTasksCategory" class="task_category">
                <div class="taskCategory__header">
                    <button class="arrowCategoryButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
                            <path d="M6 13.5L18 25.5L30 13.5" stroke="black" stroke-width="2.16667" stroke-linecap="round" stroke-linejoin="round" class="arrowButton"/>
                        </svg>
                    </button>
                    <div class="categoryHeader__name">
                        <h2>Active tasks</h2>
                        <div class="categoryHeader__taskCounter">
                            <h2 id="activeTask__Counter">0</h2>
                        </div>
                    </div>
                    <h2>Priority</h2>
                    <h2>Due date</h2>
                </div>

            <!-- Completed tasks Section -->
            <section id="completedTasksCategory" class="task_category">
                <div class="taskCategory__header">
                    <button class="arrowCategoryButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
                            <path d="M6 13.5L18 25.5L30 13.5" stroke="black" stroke-width="2.16667" stroke-linecap="round" stroke-linejoin="round" class="arrowButton"/>
                        </svg>
                    </button>
                    <div class="categoryHeader__name">
                        <h2>Completed tasks</h2>
                        <div class="categoryHeader__taskCounter">
                            <h2 id="completedTask__Counter">0</h2>
                        </div>
                    </div>
                    <h2>Priority</h2>
                    <h2>Due date</h2>
                </div>
                
            </section>
